# Railway configuration.
#
# Railpack auto-detects Python from requirements.txt, so there is no build
# override here.  The start command runs the app under gunicorn, and Railway's
# healthcheck hits /healthz, which reports the sample summary and the database
# together: it answers 503 rather than 200 if either cannot be reached.

[deploy]
startCommand = "gunicorn app:app --bind 0.0.0.0:$PORT --workers 3 --timeout 180"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
healthcheckPath = "/healthz"
healthcheckTimeout = 100
